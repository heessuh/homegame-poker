name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Engine + server unit tests, then every game played end to end against a local server.
      - run: npm run test:all
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports/
          if-no-files-found: ignore
  # The web bundle built inside the Docker image (what Fly runs) must be byte-identical to a plain `npm ci && npm run build`.
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: node scripts/web-manifest.mjs --out host-manifest.json
      - name: Build the Docker image and extract its web files
        run: |
          docker build --build-arg GIT_COMMIT=${{ github.sha }} -t mochapoker-repro .
          id=$(docker create mochapoker-repro)
          docker cp "$id:/app/apps/web/dist" docker-dist
          docker rm "$id"
          node -e 'import("./scripts/lib/manifest.mjs").then(m => process.stdout.write(JSON.stringify(m.webManifest("docker-dist"), null, 2) + "\n"))' > docker-manifest.json
      - name: Compare
        run: |
          diff host-manifest.json docker-manifest.json && echo "Docker build and plain build are byte-identical."
          echo "manifestHash $(node -p "require('./host-manifest.json').manifestHash")" >> "$GITHUB_STEP_SUMMARY"
